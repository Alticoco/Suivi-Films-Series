<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statistiques — Suivi Films &amp; Séries</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Statistiques</h1>
    <nav id="vues" class="categories" aria-label="Période" hidden></nav>
    <p id="message" class="discret">Chargement…</p>

    <div id="contenu" hidden>
      <section class="tuiles" aria-label="Temps passé">
        <div class="tuile"><span class="tuile-valeur" id="temps-total"></span><span class="discret">temps total passé</span></div>
        <div class="tuile"><span class="tuile-valeur" id="temps-films"></span><span class="discret" id="etiquette-films">devant des films</span></div>
        <div class="tuile"><span class="tuile-valeur" id="temps-episodes"></span><span class="discret" id="etiquette-episodes">devant des épisodes</span></div>
      </section>

      <h2>Titres vus</h2>
      <section class="tuiles" aria-label="Titres vus">
        <div class="tuile"><span class="tuile-valeur" id="vus-film"></span><span class="discret">films</span></div>
        <div class="tuile"><span class="tuile-valeur" id="vus-serie"></span><span class="discret">séries</span></div>
        <div class="tuile"><span class="tuile-valeur" id="vus-anime"></span><span class="discret">animés</span></div>
      </section>

      <section id="bloc-annees">
        <h2>Visionnages par année</h2>
        <div id="annees" class="annees"></div>
      </section>

      <p id="note-periode" class="discret"></p>
    </div>
  </main>

  <script src="js/icones.js"></script>
  <script src="js/commun.js"></script>
  <script src="js/statistiques.js"></script>
</body>
</html>
